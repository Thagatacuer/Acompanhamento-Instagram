  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"d2cc2bd0-d925-4051-97f8-0a5a6c0309c7\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n<helmet>\n  <style>\n    @font-face { font-family: 'Be Vietnam'; src: url(\"3fc84dc7-9279-4b7f-b607-081b39c8fbd2\") format('truetype'); font-weight: 300; font-style: normal; }\n    @font-face { font-family: 'Be Vietnam'; src: url(\"80c323fa-1e01-4999-86fa-f5082350632d\") format('truetype'); font-weight: 300; font-style: italic; }\n    @font-face { font-family: 'Be Vietnam'; src: url(\"3a8280df-d849-48ec-9bb8-6e4ef6cf3df8\") format('truetype'); font-weight: 500; font-style: normal; }\n    @font-face { font-family: 'Be Vietnam'; src: url(\"1398a8ff-6d4d-4c47-8920-85963207071a\") format('truetype'); font-weight: 500; font-style: italic; }\n    @font-face { font-family: 'Be Vietnam'; src: url(\"f268814c-c2b0-44f7-aaa3-6941ca491fd2\") format('truetype'); font-weight: 700; font-style: normal; }\n    @font-face { font-family: 'Be Vietnam'; src: url(\"e81daa65-8728-4b66-8497-81ac3f224921\") format('truetype'); font-weight: 700; font-style: italic; }\n    @font-face { font-family: 'Be Vietnam'; src: url(\"bd901bef-279c-4fc8-a81f-ad1f7da89332\") format('truetype'); font-weight: 800; font-style: normal; }\n    @font-face { font-family: 'Be Vietnam'; src: url(\"9c140bd8-cf8c-40c0-90aa-089ff48a2a6b\") format('truetype'); font-weight: 800; font-style: italic; }\n    @font-face { font-family: 'Be Vietnam'; src: url(\"39b63e57-91b9-4efa-a468-8bc6f6bc12f2\") format('truetype'); font-weight: 400; font-style: italic; }\n    body { margin: 0; }\n    a { color: #7c1a22; }\n    a:hover { color: #591319; }\n    ::-webkit-scrollbar { width: 8px; height: 8px; }\n    ::-webkit-scrollbar-thumb { background: #d8c4b0; border-radius: 4px; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:#f7f1e8;font-family:'Be Vietnam',sans-serif;color:#2a1512\">\n\n  <div style=\"max-width:1360px;margin:0 auto;padding:32px 32px 0 32px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap\">\n      <div>\n        <div style=\"font-weight:500;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:#a3402f\">Estrada das Cartas<\u002Fdiv>\n        <div style=\"font-weight:800;font-size:32px;color:#2a1512;margin-top:4px;line-height:1.1\">Crescimento nas Redes<\u002Fdiv>\n        <div style=\"font-weight:300;font-size:14px;color:#8a7a6c;margin-top:6px\">Instagram · TikTok · YouTube · Substack · Facebook<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\n        <div style=\"display:flex;gap:4px;background:#efe3d5;padding:4px;border-radius:6px\">\n          <button sc-camel-on-click=\"{{ setYearTodos }}\" style=\"border:none;cursor:pointer;padding:8px 14px;border-radius:4px;font-family:'Be Vietnam',sans-serif;font-weight:500;font-size:13px;{{ yearTodosStyle }}\">Todos os anos<\u002Fbutton>\n          <sc-for list=\"{{ years }}\" as=\"y\" hint-placeholder-count=\"1\">\n            <button sc-camel-on-click=\"{{ y.select }}\" style=\"border:none;cursor:pointer;padding:8px 14px;border-radius:4px;font-family:'Be Vietnam',sans-serif;font-weight:500;font-size:13px;{{ y.style }}\">{{ y.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ toggleImport }}\" style=\"border:1px solid #d8c4b0;background:#fffaf3;cursor:pointer;padding:9px 16px;border-radius:6px;font-family:'Be Vietnam',sans-serif;font-weight:500;font-size:13px;color:#2a1512\">Importar dados<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ doExport }}\" style=\"border:none;background:#7c1a22;color:#fdf4ee;cursor:pointer;padding:9px 16px;border-radius:6px;font-family:'Be Vietnam',sans-serif;font-weight:500;font-size:13px\">Exportar dados<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showImport }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:20px;background:#fffaf3;border:1px solid #e3d3c2;border-radius:8px;padding:20px 24px\">\n        <div style=\"font-weight:700;font-size:15px;margin-bottom:6px\">Importar dados da semana<\u002Fdiv>\n        <div style=\"font-weight:300;font-size:13px;color:#7a6a5e;margin-bottom:12px\">Cole o JSON semanal (com ou sem o wrapper <b style=\"font-weight:600\">redes<\u002Fb>) com as chaves <b style=\"font-weight:600\">instagram<\u002Fb>, <b style=\"font-weight:600\">tiktok<\u002Fb>, <b style=\"font-weight:600\">youtube<\u002Fb>, <b style=\"font-weight:600\">substack<\u002Fb> e <b style=\"font-weight:600\">facebook<\u002Fb>. Cada rede pode trazer um objeto (uma semana, com <b style=\"font-weight:600\">semana_fim<\u002Fb>) ou um array de semanas — o painel agrupa por mês automaticamente.<\u002Fdiv>\n        <textarea value=\"{{ importText }}\" sc-camel-on-change=\"{{ onImportTextChange }}\" placeholder=\"{{ importPlaceholder }}\" style=\"width:100%;min-height:140px;box-sizing:border-box;font-family:monospace;font-size:12px;padding:12px;border-radius:6px;border:1px solid #e3d3c2;background:#fffefb;color:#2a1512;resize:vertical\"><\u002Ftextarea>\n        <div style=\"display:flex;align-items:center;gap:12px;margin-top:12px\">\n          <button sc-camel-on-click=\"{{ doImport }}\" style=\"border:none;background:#7c1a22;color:#fdf4ee;cursor:pointer;padding:10px 18px;border-radius:6px;font-family:'Be Vietnam',sans-serif;font-weight:500;font-size:13px\">Processar importação<\u002Fbutton>\n          <div style=\"font-size:13px;font-weight:500;color:{{ importFeedbackColor }}\">{{ importFeedback }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"display:flex;gap:6px;margin-top:26px;border-bottom:1px solid #e3d3c2\">\n      <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"5\">\n        <button sc-camel-on-click=\"{{ t.select }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1360px;margin:0 auto;padding:28px 32px 60px 32px\">\n\n    <sc-if value=\"{{ isGeral }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px;margin-bottom:22px\">\n          <sc-for list=\"{{ geralCards }}\" as=\"c\" hint-placeholder-count=\"5\">\n            <div style=\"background:#fffaf3;border:1px solid #e3d3c2;border-radius:8px;padding:22px\">\n              <div style=\"width:32px;height:4px;background:{{ c.color }};border-radius:2px;margin-bottom:16px\"><\u002Fdiv>\n              <div style=\"font-size:12px;font-weight:500;color:#8a7a6c;text-transform:uppercase;letter-spacing:0.06em\">{{ c.label }}<\u002Fdiv>\n              <div style=\"font-size:28px;font-weight:800;margin-top:6px\">{{ c.seguidoresAtual }}<\u002Fdiv>\n              <div style=\"font-size:13px;font-weight:500;margin-top:10px;color:{{ c.deltaColor }}\">{{ c.crescimentoTexto }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"background:#fffaf3;border:1px solid #e3d3c2;border-radius:8px;padding:24px 28px\">\n          <div style=\"font-size:16px;font-weight:700;margin-bottom:4px\">Engajamento médio por rede<\u002Fdiv>\n          <div style=\"font-size:13px;font-weight:300;color:#8a7a6c;margin-bottom:20px\">{{ periodLabel }} · qual rede está puxando o engajamento<\u002Fdiv>\n          <sc-for list=\"{{ geralEngBars }}\" as=\"b\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:16px\">\n              <div style=\"width:84px;font-size:13px;font-weight:500;color:#5c4d42\">{{ b.label }}<\u002Fdiv>\n              <div style=\"flex:1;background:#efe3d5;border-radius:3px;height:14px;overflow:hidden\">\n                <div style=\"height:100%;border-radius:3px;background:{{ b.color }};width:{{ b.widthPct }}\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"width:56px;text-align:right;font-size:13px;font-weight:700\">{{ b.valueText }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isNet }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:12px\">\n          <div style=\"display:flex;align-items:center;gap:10px\">\n            <div style=\"width:10px;height:10px;border-radius:50%;background:{{ net.color }}\"><\u002Fdiv>\n            <div style=\"font-size:20px;font-weight:700\">{{ net.label }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:4px;background:#efe3d5;padding:4px;border-radius:6px\">\n            <button sc-camel-on-click=\"{{ setMensal }}\" style=\"border:none;cursor:pointer;padding:7px 14px;border-radius:4px;font-family:'Be Vietnam',sans-serif;font-weight:500;font-size:13px;{{ mensalStyle }}\">Mensal<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ setAnual }}\" style=\"border:none;cursor:pointer;padding:7px 14px;border-radius:4px;font-family:'Be Vietnam',sans-serif;font-weight:500;font-size:13px;{{ anualStyle }}\">Anual<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px\">\n          <sc-for list=\"{{ net.kpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n            <div style=\"background:#fffaf3;border:1px solid #e3d3c2;border-radius:8px;padding:18px 20px\">\n              <div style=\"font-size:12px;font-weight:500;color:#8a7a6c;text-transform:uppercase;letter-spacing:0.05em\">{{ k.label }}<\u002Fdiv>\n              <div style=\"font-size:24px;font-weight:800;margin-top:6px\">{{ k.valueText }}<\u002Fdiv>\n              <sc-if value=\"{{ k.hasDelta }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:12px;font-weight:500;margin-top:8px;color:{{ k.deltaColor }}\">{{ k.deltaText }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px\">\n          <div style=\"background:#fffaf3;border:1px solid #e3d3c2;border-radius:8px;padding:20px 22px\">\n            <div style=\"font-size:15px;font-weight:700;margin-bottom:14px\">Evolução de {{ net.followerLabel }}<\u002Fdiv>\n            <svg sc-camel-view-box=\"0 0 600 190\" style=\"width:100%;height:180px;display:block\">\n              <defs>\n                <linearGradient id=\"gradSeg\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n                  <stop offset=\"0%\" stop-color=\"{{ net.color }}\" stop-opacity=\"0.32\"><\u002Fstop>\n                  <stop offset=\"100%\" stop-color=\"{{ net.color }}\" stop-opacity=\"0\"><\u002Fstop>\n                <\u002FlinearGradient>\n              <\u002Fdefs>\n              <polygon points=\"{{ net.seguidoresAreaPoints }}\" fill=\"url(#gradSeg)\"><\u002Fpolygon>\n              <polyline points=\"{{ net.seguidoresLinePoints }}\" fill=\"none\" stroke=\"{{ net.color }}\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpolyline>\n              <sc-for list=\"{{ net.seguidoresDots }}\" as=\"d\" hint-placeholder-count=\"6\">\n                <circle cx=\"{{ d.x }}\" cy=\"{{ d.y }}\" r=\"4\" fill=\"{{ net.color }}\"><\u002Fcircle>\n              <\u002Fsc-for>\n            <\u002Fsvg>\n            <div style=\"display:flex;justify-content:space-between;margin-top:6px\">\n              <sc-for list=\"{{ net.axisLabels }}\" as=\"a\" hint-placeholder-count=\"6\">\n                <div style=\"font-size:11px;font-weight:500;color:#9a8a7c\">{{ a.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fffaf3;border:1px solid #e3d3c2;border-radius:8px;padding:20px 22px\">\n            <div style=\"font-size:15px;font-weight:700;margin-bottom:14px\">{{ net.chart2Label }}<\u002Fdiv>\n            <svg sc-camel-view-box=\"0 0 600 190\" style=\"width:100%;height:180px;display:block\">\n              <defs>\n                <linearGradient id=\"gradEng\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n                  <stop offset=\"0%\" stop-color=\"{{ net.color }}\" stop-opacity=\"0.32\"><\u002Fstop>\n                  <stop offset=\"100%\" stop-color=\"{{ net.color }}\" stop-opacity=\"0\"><\u002Fstop>\n                <\u002FlinearGradient>\n              <\u002Fdefs>\n              <polygon points=\"{{ net.engajamentoAreaPoints }}\" fill=\"url(#gradEng)\"><\u002Fpolygon>\n              <polyline points=\"{{ net.engajamentoLinePoints }}\" fill=\"none\" stroke=\"{{ net.color }}\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpolyline>\n              <sc-for list=\"{{ net.engajamentoDots }}\" as=\"d\" hint-placeholder-count=\"6\">\n                <circle cx=\"{{ d.x }}\" cy=\"{{ d.y }}\" r=\"4\" fill=\"{{ net.color }}\"><\u002Fcircle>\n              <\u002Fsc-for>\n            <\u002Fsvg>\n            <div style=\"display:flex;justify-content:space-between;margin-top:6px\">\n              <sc-for list=\"{{ net.axisLabels }}\" as=\"a\" hint-placeholder-count=\"6\">\n                <div style=\"font-size:11px;font-weight:500;color:#9a8a7c\">{{ a.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fffaf3;border:1px solid #e3d3c2;border-radius:8px;padding:22px 24px\">\n          <div style=\"font-size:15px;font-weight:700;margin-bottom:2px\">Melhores conteúdos do mês<\u002Fdiv>\n          <div style=\"font-size:13px;font-weight:300;color:#8a7a6c;margin-bottom:16px\">{{ net.mesAtualLabel }} · ranqueados por engajamento<\u002Fdiv>\n          <sc-for list=\"{{ net.topContent }}\" as=\"t\" hint-placeholder-count=\"5\">\n            <a href=\"{{ t.link }}\" target=\"_blank\" style=\"display:flex;align-items:center;gap:16px;padding:12px 10px;border-radius:6px;text-decoration:none;color:#2a1512;border-top:1px solid #eee0d3\" style-hover=\"background:#f3e9dc\">\n              <div style=\"width:26px;height:26px;border-radius:50%;background:{{ net.colorSoft }};color:{{ net.color }};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0\">{{ t.rank }}<\u002Fdiv>\n              <div style=\"flex:1;font-size:14px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ t.titulo }}<\u002Fdiv>\n              <div style=\"font-size:13px;font-weight:600;color:{{ net.color }};flex-shrink:0\">{{ t.metricLabel }}: {{ t.metricValueText }}<\u002Fdiv>\n              <sc-if value=\"{{ t.hasSecondary }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:13px;font-weight:300;color:#8a7a6c;flex-shrink:0\">{{ t.secondaryLabel }}: {{ t.secondaryValueText }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst NET_META = {\n  instagram: { label: 'Instagram', color: '#a3202b', colorSoft: '#f3dcda', followerLabel: 'seguidores', followerKpiLabel: 'Seguidores', chart2Label: 'Taxa de engajamento (interações / alcance)' },\n  facebook:  { label: 'Facebook',  color: '#44481d', colorSoft: '#e6e8da', followerLabel: 'seguidores', followerKpiLabel: 'Seguidores', chart2Label: 'Taxa de engajamento (interações / alcance)' },\n  tiktok:    { label: 'TikTok',    color: '#16324f', colorSoft: '#dde6ee', followerLabel: 'seguidores', followerKpiLabel: 'Seguidores', chart2Label: 'Taxa de engajamento' },\n  substack:  { label: 'Substack',  color: '#b5822f', colorSoft: '#f3e6d3', followerLabel: 'inscritos', followerKpiLabel: 'Inscritos totais', chart2Label: 'Taxa de abertura' },\n  youtube:   { label: 'YouTube',   color: '#7a3350', colorSoft: '#ecdbe1', followerLabel: 'inscritos', followerKpiLabel: 'Inscritos', chart2Label: 'Taxa de engajamento (curtidas + comentários / visualizações)' }\n};\n\nconst TABS = [\n  { key: 'geral', label: 'Visão Geral' },\n  { key: 'instagram', label: 'Instagram' },\n  { key: 'tiktok', label: 'TikTok' },\n  { key: 'youtube', label: 'YouTube' },\n  { key: 'substack', label: 'Substack' },\n  { key: 'facebook', label: 'Facebook' }\n];\n\nconst MONTHS_PT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];\n\nconst FIELD_SPEC = {\n  instagram: { sum: ['publicacoes', 'alcance', 'visualizacoes', 'interacoes', 'compartilhamentos', 'stories'], avg: [], last: ['seguidores'], list: 'melhores_posts' },\n  facebook: { sum: ['publicacoes', 'alcance', 'visualizacoes', 'interacoes', 'compartilhamentos', 'stories'], avg: [], last: ['seguidores'], list: 'melhores_posts' },\n  tiktok: { sum: ['publicacoes', 'visualizacoes', 'curtidas', 'comentarios', 'compartilhamentos'], avg: [], last: ['seguidores'], list: 'melhores_videos' },\n  substack: { sum: ['posts_publicados_semana', 'novos_inscritos'], avg: ['taxa_abertura_media_semana', 'taxa_cliques_media_semana'], last: ['inscritos_totais', 'inscritos_pagos'], list: 'melhores_posts' },\n  youtube: { sum: ['publicacoes', 'visualizacoes', 'curtidas', 'comentarios'], avg: [], last: ['inscritos_atuais'], list: 'melhores_videos' }\n};\n\nfunction monthLabel(mes) {\n  if (!mes) return '';\n  const parts = mes.split('-');\n  const idx = parseInt(parts[1], 10) - 1;\n  return MONTHS_PT[idx] + '/' + parts[0].slice(2);\n}\n\nfunction fmt(n) {\n  if (n === undefined || n === null || isNaN(n)) return '0';\n  return Math.round(n).toLocaleString('pt-BR');\n}\n\nfunction fmtPct(n) {\n  if (n === undefined || n === null || isNaN(n)) return '0%';\n  return n.toFixed(1).replace('.', ',') + '%';\n}\n\nfunction sampleData() {\n  return {\n    instagram: [],\n    facebook: [],\n    tiktok: [],\n    substack: [],\n    youtube: []\n  };\n}\n\nclass Component extends DCLogic {\n  state = {\n    activeTab: 'geral',\n    selectedYear: 'todos',\n    periodMode: 'mensal',\n    showImport: false,\n    importText: '',\n    importFeedback: '',\n    importOk: true,\n    data: null\n  };\n\n  componentDidMount() {\n    let data = null;\n    try {\n      const raw = localStorage.getItem('edc-dashboard-data-v1');\n      if (raw) data = JSON.parse(raw);\n    } catch (e) {}\n    if (!data) data = sampleData();\n    this.setState({ data });\n  }\n\n  saveData(data) {\n    try { localStorage.setItem('edc-dashboard-data-v1', JSON.stringify(data)); } catch (e) {}\n  }\n\n  weekKey(entry) {\n    return entry && (entry.semana_fim || entry.semana_inicio || entry.mes);\n  }\n\n  monthOf(entry) {\n    if (!entry) return null;\n    if (entry.mes) return entry.mes;\n    const d = entry.semana_fim || entry.semana_inicio;\n    return d ? d.slice(0, 7) : null;\n  }\n\n  monthlyList(key) {\n    const raw = (this.state.data && this.state.data[key]) || [];\n    const spec = FIELD_SPEC[key];\n    const groups = {};\n    raw.forEach(entry => {\n      const mes = this.monthOf(entry);\n      if (!mes) return;\n      if (!groups[mes]) groups[mes] = [];\n      groups[mes].push(entry);\n    });\n    return Object.keys(groups).sort().map(mes => {\n      const weeks = groups[mes].slice().sort((a, b) => (this.weekKey(a) || '').localeCompare(this.weekKey(b) || ''));\n      const agg = { mes };\n      spec.sum.forEach(f => { agg[f] = weeks.reduce((s, w) => s + (w[f] || 0), 0); });\n      spec.avg.forEach(f => {\n        const vals = weeks.map(w => w[f]).filter(v => v !== undefined && v !== null);\n        agg[f] = vals.length ? vals.reduce((s, v) => s + v, 0) / vals.length : 0;\n      });\n      spec.last.forEach(f => {\n        const withVal = weeks.filter(w => w[f] !== undefined && w[f] !== null);\n        agg[f] = withVal.length ? withVal[withVal.length - 1][f] : 0;\n      });\n      let merged = [];\n      weeks.forEach(w => { if (Array.isArray(w[spec.list])) merged = merged.concat(w[spec.list]); });\n      agg[spec.list] = merged;\n      return agg;\n    });\n  }\n\n  engRate(key, m) {\n    if (key === 'instagram' || key === 'facebook') {\n      if (m.alcance) return (m.interacoes / m.alcance) * 100;\n      return m.visualizacoes ? (m.interacoes / m.visualizacoes) * 100 : 0;\n    }\n    if (key === 'tiktok') return m.visualizacoes ? (((m.curtidas || 0) + (m.comentarios || 0) + (m.compartilhamentos || 0)) / m.visualizacoes) * 100 : 0;\n    if (key === 'substack') return m.taxa_abertura_media_semana || 0;\n    if (key === 'youtube') return m.visualizacoes ? (((m.curtidas || 0) + (m.comentarios || 0)) / m.visualizacoes) * 100 : 0;\n    return 0;\n  }\n\n  followerVal(key, m) {\n    if (key === 'substack') return m.inscritos_totais;\n    if (key === 'youtube') return m.inscritos_atuais;\n    return m.seguidores;\n  }\n\n  filterByYear(list) {\n    const y = this.state.selectedYear;\n    if (y === 'todos') return list;\n    return list.filter(m => m.mes.slice(0, 4) === y);\n  }\n\n  seriesFor(key, list) {\n    const filtered = this.filterByYear(list).slice().sort((a, b) => a.mes.localeCompare(b.mes));\n    if (this.state.periodMode === 'mensal') {\n      return filtered.map(m => ({ label: monthLabel(m.mes), seguidores: this.followerVal(key, m), engajamento: this.engRate(key, m) }));\n    }\n    const byYear = {};\n    filtered.forEach(m => {\n      const y = m.mes.slice(0, 4);\n      if (!byYear[y]) byYear[y] = [];\n      byYear[y].push(m);\n    });\n    return Object.keys(byYear).sort().map(y => {\n      const months = byYear[y].sort((a, b) => a.mes.localeCompare(b.mes));\n      const last = months[months.length - 1];\n      const avgEng = months.reduce((s, m) => s + this.engRate(key, m), 0) / months.length;\n      return { label: y, seguidores: this.followerVal(key, last), engajamento: avgEng };\n    });\n  }\n\n  buildChart(values) {\n    const w = 600, h = 190, padTop = 14, padBottom = 14;\n    const n = values.length;\n    if (n === 0) return { line: '', area: '', dots: [], axis: [] };\n    const min = Math.min(...values);\n    const max = Math.max(...values);\n    const range = (max - min) || 1;\n    const pts = values.map((v, i) => {\n      const x = n === 1 ? w / 2 : (i / (n - 1)) * (w - 20) + 10;\n      const y = padTop + (1 - (v - min) / range) * (h - padTop - padBottom);\n      return { x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10 };\n    });\n    const line = pts.map(p => p.x + ',' + p.y).join(' ');\n    const area = pts.map(p => p.x + ',' + p.y).join(' ') + ' ' + pts[pts.length - 1].x + ',' + (h - padBottom) + ' ' + pts[0].x + ',' + (h - padBottom);\n    return { line, area, dots: pts };\n  }\n\n  computeNet(key) {\n    const meta = NET_META[key];\n    const list = this.monthlyList(key);\n    const sorted = list.slice().sort((a, b) => a.mes.localeCompare(b.mes));\n    const latest = sorted[sorted.length - 1];\n    const prev = sorted[sorted.length - 2];\n    if (!latest) return null;\n\n    const kpis = [];\n    const deltaOf = (curr, before) => {\n      if (before === undefined || before === null || before === 0) return null;\n      const pct = ((curr - before) / before) * 100;\n      return { hasDelta: true, deltaText: (pct >= 0 ? '↑ ' : '↓ ') + fmtPct(Math.abs(pct)) + ' vs mês anterior', deltaColor: pct >= 0 ? '#3e6b2f' : '#a3202b' };\n    };\n\n    if (key === 'instagram') {\n      const followerDelta = prev ? deltaOf(latest.seguidores, prev.seguidores) : null;\n      kpis.push({ label: 'Seguidores', valueText: fmt(latest.seguidores), ...(followerDelta || { hasDelta: false }) });\n      kpis.push({ label: latest.alcance ? 'Alcance' : 'Visualizações', valueText: fmt(latest.alcance || latest.visualizacoes), hasDelta: false });\n      kpis.push({ label: 'Interações', valueText: fmt(latest.interacoes), hasDelta: false });\n      kpis.push({ label: 'Publicações', valueText: fmt(latest.publicacoes), hasDelta: false });\n      kpis.push({ label: 'Stories', valueText: fmt(latest.stories), hasDelta: false });\n    } else if (key === 'facebook') {\n      const followerDelta = prev ? deltaOf(latest.seguidores, prev.seguidores) : null;\n      kpis.push({ label: 'Seguidores', valueText: fmt(latest.seguidores), ...(followerDelta || { hasDelta: false }) });\n      kpis.push({ label: 'Visualizações', valueText: fmt(latest.visualizacoes), hasDelta: false });\n      kpis.push({ label: 'Interações', valueText: fmt(latest.interacoes), hasDelta: false });\n      kpis.push({ label: 'Publicações', valueText: fmt(latest.publicacoes), hasDelta: false });\n      kpis.push({ label: 'Compartilhamentos', valueText: fmt(latest.compartilhamentos), hasDelta: false });\n    } else if (key === 'tiktok') {\n      const followerDelta = prev ? deltaOf(latest.seguidores, prev.seguidores) : null;\n      kpis.push({ label: 'Seguidores', valueText: fmt(latest.seguidores), ...(followerDelta || { hasDelta: false }) });\n      kpis.push({ label: 'Visualizações', valueText: fmt(latest.visualizacoes), hasDelta: false });\n      kpis.push({ label: 'Curtidas', valueText: fmt(latest.curtidas), hasDelta: false });\n      kpis.push({ label: 'Publicações', valueText: fmt(latest.publicacoes), hasDelta: false });\n    } else if (key === 'substack') {\n      const followerDelta = prev ? deltaOf(latest.inscritos_totais, prev.inscritos_totais) : null;\n      kpis.push({ label: 'Inscritos totais', valueText: fmt(latest.inscritos_totais), ...(followerDelta || { hasDelta: false }) });\n      kpis.push({ label: 'Novos inscritos', valueText: fmt(latest.novos_inscritos), hasDelta: false });\n      kpis.push({ label: 'Taxa de abertura', valueText: fmtPct(latest.taxa_abertura_media_semana), hasDelta: false });\n      kpis.push({ label: 'Inscritos pagos', valueText: fmt(latest.inscritos_pagos), hasDelta: false });\n    } else if (key === 'youtube') {\n      const followerDelta = prev ? deltaOf(latest.inscritos_atuais, prev.inscritos_atuais) : null;\n      kpis.push({ label: 'Inscritos', valueText: fmt(latest.inscritos_atuais), ...(followerDelta || { hasDelta: false }) });\n      kpis.push({ label: 'Visualizações', valueText: fmt(latest.visualizacoes), hasDelta: false });\n      kpis.push({ label: 'Curtidas', valueText: fmt(latest.curtidas), hasDelta: false });\n      kpis.push({ label: 'Publicações', valueText: fmt(latest.publicacoes), hasDelta: false });\n    }\n\n    const series = this.seriesFor(key, list);\n    const segChart = this.buildChart(series.map(s => s.seguidores));\n    const engChart = this.buildChart(series.map(s => s.engajamento));\n    const axisLabels = series.map((s, i) => ({ x: i, label: s.label }));\n\n    let rawTop = [];\n    if (key === 'instagram') {\n      rawTop = (latest.melhores_posts || []).map(p => (p.alcance\n        ? { titulo: p.titulo, link: p.link || '#', metricLabel: 'Alcance', metricValueText: fmt(p.alcance), secondaryLabel: 'Interações', secondaryValueText: fmt(p.interacoes), hasSecondary: true, sortVal: p.interacoes / p.alcance }\n        : { titulo: p.titulo, link: p.link || '#', metricLabel: 'Visualizações', metricValueText: fmt(p.visualizacoes), secondaryLabel: 'Interações', secondaryValueText: fmt(p.interacoes), hasSecondary: true, sortVal: p.visualizacoes ? p.interacoes / p.visualizacoes : 0 }));\n    } else if (key === 'facebook') {\n      rawTop = (latest.melhores_posts || []).map(p => ({ titulo: p.titulo, link: p.link || '#', metricLabel: 'Visualizações', metricValueText: fmt(p.visualizacoes), secondaryLabel: 'Interações', secondaryValueText: fmt(p.interacoes), hasSecondary: true, sortVal: p.visualizacoes ? p.interacoes / p.visualizacoes : 0 }));\n    } else if (key === 'tiktok') {\n      rawTop = (latest.melhores_videos || []).map(p => ({ titulo: p.titulo, link: p.link || '#', metricLabel: 'Visualizações', metricValueText: fmt(p.visualizacoes), secondaryLabel: 'Curtidas', secondaryValueText: fmt(p.curtidas), hasSecondary: true, sortVal: p.visualizacoes ? p.curtidas / p.visualizacoes : 0 }));\n    } else if (key === 'substack') {\n      rawTop = (latest.melhores_posts || []).map(p => ({ titulo: p.titulo, link: p.link || '#', metricLabel: 'Taxa de abertura', metricValueText: fmtPct(p.taxa_abertura), secondaryLabel: '', secondaryValueText: '', hasSecondary: false, sortVal: p.taxa_abertura || 0 }));\n    } else if (key === 'youtube') {\n      rawTop = (latest.melhores_videos || []).map(p => ({ titulo: p.titulo, link: p.link || '#', metricLabel: 'Visualizações', metricValueText: fmt(p.visualizacoes), secondaryLabel: 'Curtidas', secondaryValueText: fmt(p.curtidas), hasSecondary: true, sortVal: p.visualizacoes ? p.curtidas / p.visualizacoes : 0 }));\n    }\n    const topContent = rawTop.sort((a, b) => b.sortVal - a.sortVal).slice(0, 5).map((t, i) => ({ ...t, rank: i + 1 }));\n\n    return {\n      key, label: meta.label, color: meta.color, colorSoft: meta.colorSoft,\n      followerLabel: meta.followerLabel, chart2Label: meta.chart2Label,\n      kpis,\n      seguidoresLinePoints: segChart.line, seguidoresAreaPoints: segChart.area,\n      seguidoresDots: segChart.dots,\n      engajamentoLinePoints: engChart.line, engajamentoAreaPoints: engChart.area,\n      engajamentoDots: engChart.dots,\n      axisLabels,\n      mesAtualLabel: monthLabel(latest.mes),\n      topContent\n    };\n  }\n\n  computeGeral() {\n    const keys = ['instagram', 'tiktok', 'youtube', 'substack', 'facebook'];\n    const geralCards = keys.map(key => {\n      const meta = NET_META[key];\n      const list = this.monthlyList(key);\n      const filtered = this.filterByYear(list).slice().sort((a, b) => a.mes.localeCompare(b.mes));\n      const first = filtered[0];\n      const last = filtered[filtered.length - 1];\n      let crescimentoTexto = 'sem dados';\n      let deltaColor = '#8a7a6c';\n      if (first && last && first !== last) {\n        const fv = this.followerVal(key, first);\n        const lv = this.followerVal(key, last);\n        if (fv) {\n          const pct = ((lv - fv) / fv) * 100;\n          crescimentoTexto = (pct >= 0 ? '↑ ' : '↓ ') + fmtPct(Math.abs(pct)) + ' no período';\n          deltaColor = pct >= 0 ? '#3e6b2f' : '#a3202b';\n        }\n      } else if (first) {\n        crescimentoTexto = 'apenas 1 mês no período';\n      }\n      return {\n        key, label: meta.label, color: meta.color,\n        seguidoresAtual: last ? fmt(this.followerVal(key, last)) : '—',\n        crescimentoTexto, deltaColor\n      };\n    });\n\n    const engVals = keys.map(key => {\n      const list = this.monthlyList(key);\n      const filtered = this.filterByYear(list);\n      if (!filtered.length) return { key, val: 0 };\n      const avg = filtered.reduce((s, m) => s + this.engRate(key, m), 0) / filtered.length;\n      return { key, val: avg };\n    });\n    const maxEng = Math.max(...engVals.map(e => e.val), 1);\n    const geralEngBars = engVals.map(e => ({\n      label: NET_META[e.key].label, color: NET_META[e.key].color,\n      widthPct: Math.max(4, (e.val / maxEng) * 100) + '%',\n      valueText: fmtPct(e.val)\n    }));\n\n    return { geralCards, geralEngBars };\n  }\n\n  doImport = () => {\n    let parsed;\n    try {\n      parsed = JSON.parse(this.state.importText);\n    } catch (e) {\n      this.setState({ importFeedback: 'JSON inválido — confira a formatação.', importOk: false });\n      return;\n    }\n    const source = parsed.redes || parsed;\n    const data = { ...this.state.data };\n    let count = 0;\n    ['instagram', 'tiktok', 'youtube', 'substack', 'facebook'].forEach(key => {\n      if (!source[key]) return;\n      const entries = Array.isArray(source[key]) ? source[key] : [source[key]];\n      const list = (data[key] || []).slice();\n      entries.forEach(entry => {\n        const k = this.weekKey(entry);\n        if (!k) return;\n        const idx = list.findIndex(m => this.weekKey(m) === k);\n        if (idx >= 0) list[idx] = entry; else list.push(entry);\n        count++;\n      });\n      list.sort((a, b) => (this.weekKey(a) || '').localeCompare(this.weekKey(b) || ''));\n      data[key] = list;\n    });\n    if (count === 0) {\n      this.setState({ importFeedback: 'Nenhuma semana reconhecida — confira as chaves e os campos \"semana_fim\"/\"semana_inicio\".', importOk: false });\n      return;\n    }\n    this.saveData(data);\n    this.setState({ data, importText: '', importFeedback: count + ' semana(s) importada(s) com sucesso.', importOk: true });\n  };\n\n  doExport = () => {\n    const data = this.state.data || {};\n    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url;\n    a.download = 'crescimento-redes-estrada-das-cartas.json';\n    document.body.appendChild(a);\n    a.click();\n    document.body.removeChild(a);\n    setTimeout(() => URL.revokeObjectURL(url), 1000);\n  };\n\n  renderVals() {\n    const data = this.state.data || sampleData();\n    const activeTab = this.state.activeTab;\n    const isGeral = activeTab === 'geral';\n    const isNet = !isGeral;\n\n    const allYears = new Set();\n    ['instagram', 'tiktok', 'youtube', 'substack', 'facebook'].forEach(k => this.monthlyList(k).forEach(m => allYears.add(m.mes.slice(0, 4))));\n    const yearsList = Array.from(allYears).sort();\n\n    const activeYearStyle = 'background:#7c1a22;color:#fdf4ee';\n    const inactiveYearStyle = 'background:transparent;color:#5c4d42';\n\n    const years = yearsList.map(y => ({\n      label: y,\n      select: () => this.setState({ selectedYear: y }),\n      style: this.state.selectedYear === y ? activeYearStyle : inactiveYearStyle\n    }));\n\n    const tabs = TABS.map(t => ({\n      key: t.key,\n      label: t.label,\n      select: () => this.setState({ activeTab: t.key }),\n      style: 'border:none;background:transparent;cursor:pointer;padding:12px 18px;font-family:\\'Be Vietnam\\',sans-serif;font-weight:600;font-size:14px;' +\n        (activeTab === t.key\n          ? 'color:#2a1512;border-bottom:2px solid #7c1a22;margin-bottom:-1px'\n          : 'color:#9a8a7c;border-bottom:2px solid transparent;margin-bottom:-1px')\n    }));\n\n    const net = isNet ? this.computeNet(activeTab) : null;\n    const geral = isGeral ? this.computeGeral() : { geralCards: [], geralEngBars: [] };\n\n    const periodLabel = this.state.selectedYear === 'todos' ? 'todo o período salvo' : ('ano de ' + this.state.selectedYear);\n\n    return {\n      showImport: this.state.showImport,\n      toggleImport: () => this.setState({ showImport: !this.state.showImport }),\n      importText: this.state.importText,\n      onImportTextChange: (e) => this.setState({ importText: e.target.value }),\n      importPlaceholder: '{\\n  \"redes\": {\\n    \"instagram\": { \"semana_inicio\": \"2026-07-04\", \"semana_fim\": \"2026-07-10\", \"seguidores\": 248, ... },\\n    \"tiktok\": { \"semana_fim\": \"2026-07-10\", ... },\\n    \"youtube\": { \"semana_fim\": \"2026-07-10\", ... },\\n    \"substack\": { \"semana_fim\": \"2026-07-10\", ... },\\n    \"facebook\": { \"semana_fim\": \"2026-07-10\", ... }\\n  }\\n}',\n      doImport: this.doImport,\n      doExport: this.doExport,\n      importFeedback: this.state.importFeedback,\n      importFeedbackColor: this.state.importOk ? '#3e6b2f' : '#a3202b',\n\n      years,\n      setYearTodos: () => this.setState({ selectedYear: 'todos' }),\n      yearTodosStyle: this.state.selectedYear === 'todos' ? activeYearStyle : inactiveYearStyle,\n\n      tabs,\n      isGeral,\n      isNet,\n      net,\n      geralCards: geral.geralCards,\n      geralEngBars: geral.geralEngBars,\n      periodLabel,\n\n      mensalStyle: this.state.periodMode === 'mensal' ? activeYearStyle : inactiveYearStyle,\n      anualStyle: this.state.periodMode === 'anual' ? activeYearStyle : inactiveYearStyle,\n      setMensal: () => this.setState({ periodMode: 'mensal' }),\n      setAnual: () => this.setState({ periodMode: 'anual' })\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
